plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mouhamad.ghostrunner'
    compileSdk 36

    defaultConfig {
        applicationId "com.mouhamad.ghostrunner"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
